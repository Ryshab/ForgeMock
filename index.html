<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Turn competitive exam response sheets into realistic, timed CBT mock tests." />
    <title>MockForge — PYQ Mock Test Studio</title>
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("mockforge.theme") === "light" ? "light" : "dark";

        document.documentElement.dataset.theme = "dark";
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>
